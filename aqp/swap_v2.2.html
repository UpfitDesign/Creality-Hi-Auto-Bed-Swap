<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plate Changer Pro | Dashboard</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card: #141417;
            --card-hover: #1c1c21;
            --text: #e1e1e6;
            --text-dim: #8b8b93;
            --primary: #00f2ff;
            --primary-glow: rgba(0, 242, 255, 0.3);
            --unload: #ff4d4d;
            --load: #2ed573;
            --home: #ffa502;
            --status: #1e90ff;
            --danger: #ff003c;
            --border: #2a2a30;
            --surface: #0e0e11;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            max-width: 1400px;
            width: 100%;
        }

        @media (max-width: 1000px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .control-panel { padding: 24px; }

        .header-group {
            margin-bottom: 24px;
            position: relative;
        }

        .printer-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .printer-subtitle {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .settings-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .settings-btn:hover { color: var(--primary); border-color: var(--primary); }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .telemetry-card {
            background: var(--surface);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .tel-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; display: block;}
        .tel-value { font-size: 1.1rem; font-weight: 700; color: var(--primary); font-family: 'JetBrains Mono', monospace; transition: color 0.3s; }
        .tel-value.heating { color: #ff4d4d; text-shadow: 0 0 10px rgba(255, 77, 77, 0.4); }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }

        button {
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.2; cursor: not-allowed; filter: grayscale(1); }

        .btn-primary { background: var(--primary); color: #000; box-shadow: 0 4px 15px var(--primary-glow); }
        .btn-outline { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--card-hover); border-color: var(--text-dim); }
        
        .btn-emergency {
            background: var(--danger);
            margin-top: 10px;
            font-size: 0.9rem;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.2);
        }

        .queue-panel { padding: 24px; height: calc(100vh - 40px); }

        .active-job-section {
            background: linear-gradient(135deg, #1a1a20 0%, #0e0e11 100%);
            border: 1px solid var(--primary);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 20px;
            position: relative;
        }

        .active-job-section::before {
            content: 'LIVE';
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--primary);
            color: #000;
            font-size: 0.6rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .active-actions {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .btn-mini-action {
            padding: 6px 12px;
            font-size: 0.7rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            transition: all 0.2s;
            background: rgba(0,0,0,0.5);
            color: #fff;
            backdrop-filter: blur(4px);
        }
        .btn-mini-action:hover:not(:disabled) { transform: translateY(-1px); }
        .btn-mini-action:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-skip:hover:not(:disabled) { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        .btn-stop:hover:not(:disabled) { background: var(--danger); border-color: var(--danger); box-shadow: 0 0 10px rgba(255,0,0,0.3); }

        .active-thumb-wrap {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .active-thumb { width: 100%; height: 100%; object-fit: cover; }

        .active-details { display: flex; flex-direction: column; justify-content: center; }
        .status-badge { font-size: 0.65rem; color: var(--primary); font-weight: 800; margin-bottom: 4px; letter-spacing: 1px; }
        .active-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 110px; }

        .progress-rail { background: rgba(255,255,255,0.05); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.8s ease; box-shadow: 0 0 10px var(--primary-glow); }

        .queue-scroller {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 8px;
        }

        .queue-scroller::-webkit-scrollbar { width: 6px; }
        .queue-scroller::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .queue-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: grab;
        }
        .queue-card:active { cursor: grabbing; }
        .queue-card.next { border-left: 4px solid var(--primary); }
        .queue-card.dragging { opacity: 0.4; border: 1px dashed var(--text-dim); }
        .queue-card.drag-over { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }

        .reorder-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .btn-move {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 0.6rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-move:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .btn-move:disabled { opacity: 0.2; cursor: default; border-color: transparent; }

        .q-thumb { width: 60px; height: 60px; border-radius: 10px; background: #000; flex-shrink: 0; object-fit: cover; }
        .q-info { flex: 1; min-width: 0; }
        .q-name { font-size: 0.85rem; font-weight: 600; color: #fff; margin-bottom: 4px; display: block; border: none; background: transparent; width: 100%; outline: none; }
        .q-meta { font-size: 0.7rem; color: var(--text-dim); display: flex; flex-direction: column; gap: 4px; }

        .q-tools { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            margin-top: 4px; 
        }

        .cfs-block {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.03);
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .cfs-label {
            font-size: 0.55rem;
            color: var(--text-dim);
            font-weight: 700;
            text-transform: uppercase;
        }

        .dot-group { display: flex; gap: 3px; }

        .tool-dot { 
            width: 7px; 
            height: 7px; 
            border-radius: 50%; 
            background: #333; 
        }
        .tool-dot.active { 
            background: #ff003c; 
            box-shadow: 0 0 5px rgba(255, 0, 60, 0.4); 
        }

        .q-actions { display: flex; align-items: center; gap: 12px; }
        
        .qty-input {
            background: #000;
            border: 1px solid var(--border);
            color: var(--primary);
            width: 45px;
            padding: 8px 4px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* Tab Styles */
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .tab {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-dim);
            transition: all 0.2s;
        }
        .tab.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
            border: 1px solid var(--border);
        }
        .tab:hover:not(.active) {
            color: var(--text);
            background: rgba(255,255,255,0.05);
        }

        .footer-summary {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 20px;
            margin: 0 -24px -24px -24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-block { display: flex; flex-direction: column; }
        .sum-val { font-size: 1.2rem; font-weight: 800; color: #fff; }
        .sum-lbl { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }

        #console {
            margin-top: 20px;
            background: #050505;
            border: 1px solid var(--border);
            border-radius: 12px;
            height: 240px;
            overflow-y: auto;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #66ef66;
            line-height: 1.5;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            padding: 32px;
        }

        .input-field {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-family: inherit;
        }

        textarea.input-field { 
            min-height: 140px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.75rem; 
            line-height: 1.4; 
            white-space: pre; 
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <div id="modal-overlay" class="modal-overlay">
        <div id="settings-modal" class="modal" style="display:none;">
            <h2 style="margin-top:0">System Config</h2>
            
            <div style="display:grid; grid-template-columns: 2fr 1fr; gap: 12px;">
                <div>
                    <label class="tel-label">Printer Name</label>
                    <input type="text" id="set-name" class="input-field" placeholder="Creality HI Bed Swap">
                </div>
                <div>
                    <label class="tel-label">Prep Delay (Min)</label>
                    <input type="number" id="set-delay" class="input-field" placeholder="12">
                </div>
            </div>
            
            <label class="tel-label">IP Address</label>
            <input type="text" id="set-ip" class="input-field" placeholder="192.168.1.XX">

            <label class="tel-label">Unload G-Code</label>
            <textarea id="set-unload" class="input-field" spellcheck="false"></textarea>
            
            <label class="tel-label">Load G-Code</label>
            <textarea id="set-load" class="input-field" spellcheck="false"></textarea>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="btn-primary" onclick="saveSettings()">Save Configuration</button>
                <button class="btn-outline" onclick="closeModals()">Cancel</button>
            </div>
        </div>

        <div id="safety-modal" class="modal" style="display:none; text-align:center;">
            <div style="font-size: 3rem; margin-bottom: 10px;">⚡</div>
            <h2>Initialize Production?</h2>
            <p style="color: var(--text-dim); margin-bottom: 24px;">Confirm build plate is loaded correctly</p>
            <button class="btn-primary" style="width:100%" onclick="beginFirstPrint()">Start Batch</button>
            <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="panel control-panel">
            <div class="header-group">
                <button class="settings-btn" onclick="openSettings()">⚙️</button>
                <h1 class="printer-title" id="display-name">Creality HI Bed Swap</h1>
                <div class="printer-subtitle" id="display-ip">Disconnected</div>
            </div>

            <div class="telemetry-grid">
                <div class="telemetry-card">
                    <span class="tel-label">Nozzle</span>
                    <span id="temp-nozzle" class="tel-value">--°</span>
                </div>
                <div class="telemetry-card">
                    <span class="tel-label">Bed</span>
                    <span id="temp-bed" class="tel-value">--°</span>
                </div>
            </div>

            <div class="btn-group">
                <button id="preheat-btn" class="btn-outline" onclick="togglePreheat()">
                    <span>🌡️</span> Preheat (60°C)
                </button>
                <button class="btn-outline" onclick="openCamera()">
                    <span>📷</span> Live Feed
                </button>
                <button class="btn-outline" onclick="runGcode('G28')">
                    <span>🏠</span> Home All
                </button>
                <button class="btn-outline" style="color: var(--unload)" onclick="runUnload()">
                    <span>⏏️</span> Manual Unload
                </button>
                <button class="btn-outline" style="color: var(--load)" onclick="runLoad()">
                    <span>📥</span> Manual Load
                </button>
                <button class="btn-outline" onclick="emergencyStop()">
                    <span>🛑</span> Emergency Stop
                </button>
            </div>

            <div id="console"></div>
            
            <div id="app-version" style="margin-top: 12px; text-align: center; font-size: 0.65rem; color: var(--text-dim); opacity: 0.5; font-family: 'JetBrains Mono', monospace;">
                v2.2
            </div>
        </div>

        <div class="panel queue-panel">
            <div class="active-job-section">
                <div class="active-actions">
                    <button class="btn-mini-action btn-skip" id="btn-cancel-next" onclick="cancelJob('next')" title="Cancel Print & Load Next" disabled>
                        <span>⏭</span> Skip
                    </button>
                    <button class="btn-mini-action btn-stop" id="btn-cancel-stop" onclick="cancelJob('stop')" title="Cancel Print & Stop Batch" disabled>
                        <span>⏹</span> Stop
                    </button>
                </div>
                <div class="active-thumb-wrap">
                    <img id="cur-thumb" class="active-thumb" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23222' d='M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-7-7z'/%3E%3C/svg%3E">
                </div>
                <div class="active-details">
                    <div class="status-badge" id="status-label">PRINTER IDLE</div>
                    <div class="active-name" id="cur-filename">Ready for Task</div>
                    <div class="progress-rail">
                        <div id="cur-progress-bar" class="progress-fill"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:0.7rem; color:var(--text-dim);">
                        <span id="cur-progress-pct">0% Complete</span>
                        <span id="cur-eta">--:--</span>
                    </div>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-container">
                <div id="tab-queue" class="tab active" onclick="switchTab('queue')">Queue</div>
                <div id="tab-history" class="tab" onclick="switchTab('history')">History</div>
            </div>

            <div id="queue-controls" style="display:flex; justify-content:flex-end; align-items:center; margin-bottom:16px;">
                <button class="btn-outline" style="padding: 6px 12px; font-size: 0.7rem;" onclick="document.getElementById('file-input').click()">
                    + Add G-Code
                </button>
                <input type="file" id="file-input" style="display:none" onchange="handleQueueUpload(event)" multiple accept=".gcode">
            </div>

            <div id="queue-list" class="queue-scroller"></div>

            <div class="footer-summary">
                <div class="summary-block">
                    <span class="sum-lbl">Total Runtime</span>
                    <span id="total-eta" class="sum-val">0h 00m</span>
                </div>
                <div class="summary-block" style="text-align:right;">
                    <span class="sum-lbl">Plates Remaining</span>
                    <span id="total-plates" class="sum-val">0</span>
                </div>
                <button id="start-prod-btn" class="btn-primary" style="padding: 16px 32px;" disabled onclick="showSafety()">
                    Launch Production
                </button>
            </div>
        </div>
    </div>

    <script>
        const APP_VERSION = "v2.2";
        const DEFAULT_UNLOAD = `M140 S0\nM104 S0\nG1 F14000 Z293\nG1 F10000 Y250\nG1 F4000 Y273\nG1 F4000 Y250\nG1 F200 Y230\nG1 F400 Y0\nG1 F100 Y0\nG1 F4000 Y260\nG1 F14000 Y200\nG1 F14000 Y130 X130\nG1 Z280`;
        const DEFAULT_LOAD = `G1 F14000 Z293 X180 Y40\nG1 Z302\nG1 F8000 X50\nG1 F500 X35\nG1 F14000 X50\nG1 Z293\nG1 X10\nG1 Z302\nG1 X162 Y-5\nG1 F14000 X150\nG1 Z293 X130\nG1 F4000 Y264\nG1 F14000 Y-5\nG1 F14000 Y8\nG1 F14000 Y130 X130\nG1 F4000 Y264\nG1 F14000 Y-5\nG1 F14000 Y8\nG1 F14000 Y130 X130\nG1 Z20`;
        const THUMB_DEFAULT = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23222' d='M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-7-7z'/%3E%3C/svg%3E";

        let AppState = {
            config: {
                name: localStorage.getItem('printerName') || "Creality HI Bed Swap",
                ip: localStorage.getItem('printerIp') || "",
                unload: localStorage.getItem('unloadMacro') || DEFAULT_UNLOAD,
                load: localStorage.getItem('loadMacro') || DEFAULT_LOAD,
                prePrintDelay: parseInt(localStorage.getItem('prePrintDelay')) || 12
            },
            queue: [],
            history: [],
            isPrinting: false,
            wasPrinting: false,
            automationActive: false,
            isLocked: false,
            isPreheating: false,
            delayCountdown: 0,
            activeTab: 'queue',
            jobStartTime: 0
        };

        let dragSrcIndex = -1;

        function log(m) {
            const c = document.getElementById('console');
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            const div = document.createElement('div');
            // Styled timestamp in yellow, message stays green (inherited)
            div.innerHTML = `<span style="color: #ffd700;">${timeString}</span> ${m}`;
            c.appendChild(div);
            c.scrollTop = c.scrollHeight;
        }

        function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        function parseTimeFromFilename(name) {
            const hMatch = name.match(/(\d+)h/i);
            const mMatch = name.match(/(\d+)m/i);
            let totalMinutes = 0;
            if (hMatch) totalMinutes += parseInt(hMatch[1]) * 60;
            if (mMatch) totalMinutes += parseInt(mMatch[1]);
            return totalMinutes; // Removed default || 30 to support UNKNOWN
        }

        function formatMinutes(total) {
            const h = Math.floor(total / 60);
            const m = total % 60;
            return `${h}h ${m.toString().padStart(2, '0')}m`;
        }

        // Helper to format duration for filename (short format)
        function formatDurationFilename(totalMins) {
            const h = Math.floor(totalMins / 60);
            const m = totalMins % 60;
            let str = '';
            if (h > 0) str += `${h}h`;
            str += `${m}m`;
            return str;
        }

        function extractThumbnail(gcodeText) {
            const thumbRegex = /;\s*thumbnail\s+begin\s+.*?\n((?:;\s*[a-zA-Z0-9+/=]+\s*\n)+);\s*thumbnail\s+end/i;
            const match = gcodeText.match(thumbRegex);
            if (match && match[1]) {
                const base64 = match[1].replace(/;\s*/g, '').replace(/\n/g, '');
                return `data:image/png;base64,${base64}`;
            }
            return THUMB_DEFAULT;
        }

        async function handleQueueUpload(e) {
            const files = Array.from(e.target.files);
            for (const file of files) {
                // Robust filter just in case of drag/drop
                if (!file.name.toLowerCase().endsWith('.gcode')) {
                    log(`Skipped invalid file: ${file.name}`);
                    continue;
                }

                log(`Analyzing ${file.name}...`);
                const text = await file.slice(0, 500000).text();
                
                // Robust Tool Detection (Ignoring comments)
                const toolsFound = new Set();
                const lines = text.split('\n');
                for (const line of lines) {
                    const clean = line.split(';')[0];
                    const match = clean.match(/\bT(\d+)\b/);
                    if (match) {
                        toolsFound.add(parseInt(match[1]));
                    }
                }
                const toolsArray = Array.from(toolsFound).sort((a, b) => a - b);
                
                // Detect RT tag for future imports
                const isRt = /_RT_/.test(file.name);

                AppState.queue.push({
                    id: crypto.randomUUID(),
                    name: file.name,
                    file: file,
                    qty: 1,
                    thumb: extractThumbnail(text),
                    tools: toolsArray,
                    timePerPlate: parseTimeFromFilename(file.name),
                    isRealTime: isRt,
                    disableMesh: false
                });
            }
            renderList();
        }

        function moveItem(index, dir) {
            const list = AppState.activeTab === 'history' ? AppState.history : AppState.queue;
            if (index + dir < 0 || index + dir >= list.length) return;
            const temp = list[index];
            list[index] = list[index + dir];
            list[index + dir] = temp;
            renderList();
        }

        function switchTab(tab) {
            AppState.activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            const qControls = document.getElementById('queue-controls');
            qControls.style.display = tab === 'queue' ? 'flex' : 'none';
            
            renderList();
        }

        function addToQueue(historyIndex) {
            const histItem = AppState.history[historyIndex];
            if (!histItem) return;
            
            const newItem = {
                ...histItem,
                id: crypto.randomUUID(),
                qty: 1,
            };
            AppState.queue.push(newItem);
            log(`Added ${histItem.name} back to queue.`);
            renderList();
        }

        function duplicateQueueItem(id) {
            const index = AppState.queue.findIndex(x => x.id === id);
            if (index === -1) return;
            
            const item = AppState.queue[index];
            const newItem = {
                ...item,
                id: crypto.randomUUID(),
                qty: 1
            };
            // Insert after current item
            AppState.queue.splice(index + 1, 0, newItem);
            renderList();
        }

        function removeFromHistory(index) {
            AppState.history.splice(index, 1);
            renderList();
        }
        
        async function saveHistoryItem(index) {
            const item = AppState.history[index];
            if (!item) return;

            let text = await item.file.text();
            
            // Construct Metadata (Matches preparePrintFile but without injection of Swap macros yet)
            const timestamp = new Date().toLocaleString();
            const toolsStr = item.tools.length > 0 ? item.tools.map(t => `T${t}`).join(', ') : "None";
            let originalTime = "N/A";
            let realTime = "N/A";
            if (item.isRealTime) {
                realTime = formatMinutes(item.timePerPlate);
            } else {
                originalTime = formatMinutes(item.timePerPlate);
            }
            
            const metaBlock = `
; --------------------------------------------------
; PLATE CHANGER PRO METADATA (SAVED HISTORY)
; Version: ${APP_VERSION}
; Filename: ${item.name}
; Original Est. Time: ${originalTime}
; Real Print Time: ${realTime}
; CFS Tools: ${toolsStr}
; Timestamp: ${timestamp}
; --------------------------------------------------
`;
            
            // Just prepend metadata, do NOT inject macros (they are injected at print time)
            const finalContent = metaBlock + text;
            
            const blob = new Blob([finalContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = item.name; // Preserves _RT_ tag
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            log(`Saved ${item.name} locally.`);
        }

        function handleDragStart(e, index) {
            dragSrcIndex = index;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', index);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.queue-card').forEach(card => card.classList.remove('drag-over'));
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            e.target.closest('.queue-card').classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.target.closest('.queue-card').classList.remove('drag-over');
        }

        function handleDrop(e, targetIndex) {
            if (e.stopPropagation) e.stopPropagation();
            
            const list = AppState.activeTab === 'history' ? AppState.history : AppState.queue;

            if (dragSrcIndex !== targetIndex && dragSrcIndex >= 0 && dragSrcIndex < list.length) {
                const item = list[dragSrcIndex];
                list.splice(dragSrcIndex, 1);
                list.splice(targetIndex, 0, item);
                renderList();
            }
            return false;
        }

        function renderList() {
            const isHistory = AppState.activeTab === 'history';
            const listData = isHistory ? AppState.history : AppState.queue;
            const listEl = document.getElementById('queue-list');
            listEl.innerHTML = '';
            
            let totalMins = 0; 
            let totalPlates = 0;
            
            AppState.queue.forEach(item => {
                totalPlates += item.qty;
                // If timePerPlate is 0 (Unknown), we still add prepDelay if queueing, 
                // but technically unknown + prep is still unknown. 
                // However, for total estimation, we can assume at least prep delay per job.
                // We'll proceed with basic arithmetic.
                totalMins += ((item.timePerPlate + AppState.config.prePrintDelay) * item.qty);
            });

            if (listData.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-dim); opacity:0.5;">
                    ${isHistory ? 'No history yet' : 'Queue is empty'}
                </div>`;
            } else {
                listData.forEach((item, i) => {
                    const div = document.createElement('div');
                    div.className = `queue-card ${!isHistory && i === 0 ? 'next' : ''}`;
                    
                    div.draggable = true;
                    div.ondragstart = (e) => handleDragStart(e, i);
                    div.ondragover = (e) => handleDragOver(e);
                    div.ondrop = (e) => handleDrop(e, i);
                    div.ondragend = (e) => handleDragEnd(e);
                    div.ondragenter = (e) => handleDragEnter(e);
                    div.ondragleave = (e) => handleDragLeave(e);

                    let cfsHtml = '<div class="q-tools">';
                    for(let c=0; c<4; c++) {
                        let dots = '';
                        for(let s=0; s<4; s++) {
                            const tId = (c*4) + s;
                            const isActive = item.tools.includes(tId);
                            dots += `<div class="tool-dot ${isActive ? 'active' : ''}"></div>`;
                        }
                        cfsHtml += `
                            <div class="cfs-block">
                                <span class="cfs-label">CFS${c+1}</span>
                                <div class="dot-group">${dots}</div>
                            </div>`;
                    }
                    cfsHtml += '</div>';

                    const isFirst = i === 0;
                    const isLast = i === listData.length - 1;

                    let actionHtml = '';
                    if (isHistory) {
                        actionHtml = `
                            <button class="btn-outline" style="padding:4px 8px; font-size:0.65rem;" onclick="addToQueue(${i})">Add to Queue</button>
                            <button style="background:transparent; color:var(--primary); padding:5px" onclick="saveHistoryItem(${i})" title="Save Locally">💾</button>
                            <button style="background:transparent; color:#444; padding:5px" onclick="removeFromHistory(${i})" title="Bin Permanently">🗑</button>
                        `;
                    } else {
                        actionHtml = `
                            <button class="btn-outline" style="padding:4px 8px; font-size:0.65rem;" onclick="duplicateQueueItem('${item.id}')" title="Duplicate this job">Duplicate</button>
                            <input type="number" class="qty-input" value="${item.qty}" min="1" onchange="updateQty('${item.id}', this.value)">
                            <button style="background:transparent; color:#444; padding:5px" onclick="removeItem('${item.id}')">✕</button>
                        `;
                    }

                    // Remove .gcode extension for display only
                    const displayName = item.name.replace(/\.gcode$/i, '');

                    div.innerHTML = `
                        <div class="reorder-col">
                            <button class="btn-move" onclick="moveItem(${i}, -1)" ${isFirst ? 'disabled' : ''}>▲</button>
                            <button class="btn-move" onclick="moveItem(${i}, 1)" ${isLast ? 'disabled' : ''}>▼</button>
                        </div>
                        <img class="q-thumb" src="${item.thumb}">
                        <div class="q-info">
                            <div style="font-size:0.85rem; font-weight:600; margin-bottom:4px;">${displayName}</div>
                            <div class="q-meta">
                                <span>⏱ ${item.isRealTime ? '<span style="color:var(--primary); font-weight:bold;">RT_ </span>' : ''}${formatMinutes(item.timePerPlate)} ${!isHistory ? `(+ ${AppState.config.prePrintDelay}m Prep)` : ''}</span>
                                ${cfsHtml}
                            </div>
                        </div>
                        <div class="q-actions">
                            ${actionHtml}
                        </div>`;
                    listEl.appendChild(div);
                });
            }

            document.getElementById('total-eta').innerText = formatMinutes(totalMins);
            document.getElementById('total-plates').innerText = totalPlates;
            document.getElementById('start-prod-btn').disabled = !AppState.queue.length || AppState.isPrinting;
        }

        function updateQty(id, v) { 
            const item = AppState.queue.find(x => x.id === id); 
            if(item) { item.qty = Math.max(1, parseInt(v) || 1); renderList(); }
        }

        function updateName(id, name) {
            const item = AppState.queue.find(x => x.id === id);
            if(item) { item.name = name; item.timePerPlate = parseTimeFromFilename(name); renderList(); }
        }
        
        function removeItem(id) { AppState.queue = AppState.queue.filter(x => x.id !== id); renderList(); }

        function getBaseUrl() { 
            if (!AppState.config.ip) return "";
            return AppState.config.ip.startsWith('http') ? AppState.config.ip : `http://${AppState.config.ip}:7125`; 
        }

        async function getStatus() {
            if (!AppState.config.ip) return;
            try {
                const r = await fetch(`${getBaseUrl()}/printer/objects/query?print_stats&display_status&extruder&heater_bed`);
                const d = await r.json();
                const s = d.result.status;
                const isNowPrinting = s.print_stats.state === "printing";
                
                document.getElementById('temp-nozzle').innerText = Math.round(s.extruder.temperature) + '°';
                
                // Bed Status
                const bedTemp = Math.round(s.heater_bed.temperature);
                const bedTarget = s.heater_bed.target;
                const bedEl = document.getElementById('temp-bed');
                
                if (bedTarget > 0) {
                    bedEl.innerHTML = `${bedTemp}° <span style="font-size:0.8em">♨️</span>`;
                    bedEl.classList.add('heating');
                } else {
                    bedEl.innerText = `${bedTemp}°`;
                    bedEl.classList.remove('heating');
                }
                
                // Enable cancel buttons only when printing
                document.getElementById('btn-cancel-next').disabled = !isNowPrinting;
                document.getElementById('btn-cancel-stop').disabled = !isNowPrinting;

                // Disable Launch Production button if printing or queue is empty
                document.getElementById('start-prod-btn').disabled = !AppState.queue.length || isNowPrinting;

                // DETECT TRANSITION FIRST (before clearing jobStartTime)
                if (AppState.automationActive && !AppState.isLocked) {
                    if (AppState.wasPrinting && !isNowPrinting) {
                        handleFinishedJob();
                    }
                }

                if (isNowPrinting) {
                    document.getElementById('status-label').innerText = "PRINTER ACTIVE";
                    const filename = s.print_stats.filename;
                    document.getElementById('cur-filename').innerText = filename;
                    const prog = (s.display_status.progress * 100).toFixed(0);
                    document.getElementById('cur-progress-bar').style.width = prog + "%";
                    document.getElementById('cur-progress-pct').innerText = prog + "% Complete";

                    // Update Thumbnail
                    const activeItem = AppState.queue.find(item => item.name === filename);
                    if (activeItem) {
                        document.getElementById('cur-thumb').src = activeItem.thumb;
                    }

                    // --- TIME CALCULATION LOGIC ---
                    const printDuration = s.print_stats.print_duration; // Seconds elapsed
                    
                    // 1. Establish Stable Start Time
                    // If we don't have a start time (e.g. page refresh), back-calculate it
                    if (AppState.jobStartTime === 0) {
                        AppState.jobStartTime = Date.now() - (printDuration * 1000);
                    }
                    
                    const startTimeDate = new Date(AppState.jobStartTime);
                    const startStr = startTimeDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

                    // 2. Determine Total Duration & Validity
                    let totalSeconds = 0;
                    let isRt = false;
                    let isValidEstimate = false;
                    
                    // Check for Real Time (_RT_) tag
                    const rtRegex = /_RT_(?:(\d+)h)?(?:(\d+)m)/;
                    const rtMatch = filename.match(rtRegex);
                    
                    if (rtMatch) {
                        let mins = 0;
                        if (rtMatch[1]) mins += parseInt(rtMatch[1]) * 60;
                        if (rtMatch[2]) mins += parseInt(rtMatch[2]);
                        
                        if (mins > 0) {
                            totalSeconds = mins * 60;
                            isRt = true;
                            isValidEstimate = true;
                        }
                    } 
                    
                    // Fallback to standard estimate
                    if (!isValidEstimate) {
                        const fileMins = parseTimeFromFilename(filename);
                        if (fileMins > 0) {
                             totalSeconds = (fileMins + AppState.config.prePrintDelay) * 60;
                             isValidEstimate = true;
                        }
                    }

                    const etaEl = document.getElementById('cur-eta');
                    
                    if (isValidEstimate) {
                        // Calc Finish Time (Start + Total)
                        // Using Start + Total is more stable than Now + Remaining if remaining fluctuates
                        const finishTime = new Date(AppState.jobStartTime + (totalSeconds * 1000));
                        const finishStr = finishTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                        
                        // Display Format: (Start 18:59 Finish 19:20)
                        etaEl.innerHTML = `(Start ${startStr} Finish ${finishStr})`;
                        etaEl.style.color = isRt ? 'var(--load)' : 'var(--home)'; // Green (RT) vs Yellow (Est)
                        etaEl.style.fontWeight = 'bold';
                        etaEl.style.fontSize = '0.8rem'; // Slightly smaller to fit
                    } else {
                        etaEl.innerText = "UNKNOWN";
                        etaEl.style.color = "var(--text-dim)";
                        etaEl.style.fontWeight = "normal";
                        etaEl.style.fontSize = '0.7rem';
                    }

                } else {
                    document.getElementById('status-label').innerText = AppState.automationActive ? "AUTOMATION STANDBY" : "IDLE";
                    // Clear finished job details
                    document.getElementById('cur-filename').innerText = "Ready for Task";
                    document.getElementById('cur-progress-bar').style.width = "0%";
                    document.getElementById('cur-progress-pct').innerText = "0% Complete";
                    
                    const etaEl = document.getElementById('cur-eta');
                    etaEl.innerText = "--:--";
                    etaEl.style.color = "var(--text-dim)";
                    etaEl.style.fontWeight = "normal";
                    etaEl.style.fontSize = '0.7rem';

                    // Reset thumbnail to default when idle
                    document.getElementById('cur-thumb').src = THUMB_DEFAULT;
                    
                    // Reset Start Time so next job gets a fresh timestamp
                    AppState.jobStartTime = 0;
                }

                AppState.wasPrinting = isNowPrinting;
                AppState.isPrinting = isNowPrinting;

            } catch (e) {}
        }

        async function cancelJob(mode) {
            if (!AppState.isPrinting) return;
            
            const msg = mode === 'next' ? "Cancel current print and start the next job?" : "Cancel print and stop production?";
            if(!confirm(msg)) return;

            log(`Cancelling job (Action: ${mode === 'next' ? 'Skip to Next' : 'Stop Batch'})...`);
            
            // If stopping, disable automation so the finish handler doesn't auto-load next
            if (mode === 'stop') {
                AppState.automationActive = false;
                renderList(); 
            }
            
            // Send Cancel Command
            await fetch(`${getBaseUrl()}/printer/print/cancel`, { method: 'POST' });
        }

        async function handleFinishedJob() {
            if (AppState.isLocked) return;
            AppState.isLocked = true;
            
            log("Job finished (Swap executed by printer). Updating queue...");
            
            // Calc True Print Time
            const endTime = Date.now();
            // Default to parsed time if jobStartTime wasn't set correctly
            let durationMins = 0;
            if (AppState.jobStartTime > 0) {
                // Ensure at least 1 minute is recorded for short prints
                durationMins = Math.max(1, Math.round((endTime - AppState.jobStartTime) / 60000));
            }

            // Update Queue (Decrement qty or remove item)
            if (AppState.queue.length > 0) {
                AppState.queue[0].qty--;
                if (AppState.queue[0].qty <= 0) {
                    const finishedItem = AppState.queue.shift();
                    
                    // Update with Real Time Data for History
                    if (durationMins > 0) {
                        finishedItem.timePerPlate = durationMins;
                        finishedItem.isRealTime = true;
                        
                        const newTimeStr = `_RT_${formatDurationFilename(durationMins)}`;
                        let baseName = finishedItem.name.replace(/\.gcode$/i, ''); // Strip ext
                        
                        // 1. Remove existing _RT_ tag if present
                        baseName = baseName.replace(/_RT_(\d+h)?(\d+m)?(\d+s)?$/i, '');
                        
                        // 2. Remove standard time tag if present (e.g. _1h30m, _45m)
                        // Matches _ at end, followed by combinations of digits and h/m/s
                        baseName = baseName.replace(/_(\d+h)?(\d+m)?(\d+s)?$/i, '');
                        
                        // 3. Construct new name
                        finishedItem.name = `${baseName}${newTimeStr}.gcode`;
                        
                        log(`Updated history filename: ${finishedItem.name}`);
                    }

                    // Move to History
                    AppState.history.unshift({ ...finishedItem, qty: 1, id: crypto.randomUUID() });
                }
            }
            renderList();
            
            // Check if we continue or stop
            if (AppState.queue.length > 0) {
                log("Queue active. Initiating next job...");
                // Small delay to ensure printer state is fully settled as 'Idle' before new upload
                setTimeout(() => {
                    startJob(AppState.queue[0]);
                }, 2000);
            } else {
                log("Batch Complete. Fresh plate loaded by final job.");
                AppState.automationActive = false;
                // Clear printer display
                await fetch(`${getBaseUrl()}/printer/gcode/script?script=M117 Production Complete`, { method: 'POST' });
            }
            
            AppState.isLocked = false;
        }

        async function preparePrintFile(job) {
            log(`Preparing file: ${job.name}...`);
            let text = await job.file.text();

            // --- METADATA INJECTION START ---
            const timestamp = new Date().toLocaleString();
            const toolsStr = job.tools.length > 0 ? job.tools.map(t => `T${t}`).join(', ') : "None";
            
            let originalTime = "N/A";
            let realTime = "N/A";

            if (job.isRealTime) {
                realTime = formatMinutes(job.timePerPlate);
            } else {
                originalTime = formatMinutes(job.timePerPlate);
            }

            const metaBlock = `
; --------------------------------------------------
; PLATE CHANGER PRO METADATA
; Version: ${APP_VERSION}
; Original Filename: ${job.name}
; Original Est. Time: ${originalTime}
; Real Print Time: ${realTime}
; CFS Tools: ${toolsStr}
; Timestamp: ${timestamp}
; --------------------------------------------------
`;
            text = metaBlock + text;
            // --- METADATA INJECTION END ---

            // 1. Disable Motor Off commands (M84/M18) to keep position for swap
            if (/^M(84|18)/m.test(text)) {
                text = text.replace(/^M(84|18)/gim, '; $& - Disabled by Automation');
            }

            // 2. Inject Swap Sequence before END_PRINT
            const swapCode = `
; --- PLATE CHANGER PRO: INJECTED SWAP SEQUENCE START ---
; Unload Macro
${AppState.config.unload}
; Load Macro
${AppState.config.load}
; --- PLATE CHANGER PRO: INJECTED SWAP SEQUENCE END ---
`;
            if (/END_PRINT/i.test(text)) {
                text = text.replace(/END_PRINT/i, `${swapCode}\nEND_PRINT`);
            } else {
                // Fallback: Append if no END_PRINT found
                text += `\n${swapCode}`;
            }

            return new File([text], job.name, { type: job.file.type });
        }

        async function startJob(job) {
            try {
                // Prepare file dynamically based on current settings
                const fileToUpload = await preparePrintFile(job);

                const fd = new FormData();
                fd.append('file', fileToUpload, job.name);
                await fetch(`${getBaseUrl()}/server/files/upload`, { method: 'POST', body: fd });
                
                // Track start time
                AppState.jobStartTime = Date.now();
                
                await fetch(`${getBaseUrl()}/printer/print/start?filename=${encodeURIComponent(job.name)}`, { method: 'POST' });
                log(`Started: ${job.name}`);
            } catch (e) {
                log("Job start failure: " + e.message);
                AppState.automationActive = false;
            }
        }

        async function runGcode(c) {
            const lines = c.split('\n').filter(l => l.trim());
            for (const line of lines) { await fetch(`${getBaseUrl()}/printer/gcode/script?script=${encodeURIComponent(line)}`, {method:'POST'}); }
        }

        async function runUnload() { log("Unloading..."); await runGcode(AppState.config.unload); }
        async function runLoad() { log("Loading..."); await runGcode(AppState.config.load); }

        function openSettings() {
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('settings-modal').style.display = 'block';
            document.getElementById('set-name').value = AppState.config.name;
            document.getElementById('set-delay').value = AppState.config.prePrintDelay;
            document.getElementById('set-ip').value = AppState.config.ip;
            document.getElementById('set-unload').value = AppState.config.unload;
            document.getElementById('set-load').value = AppState.config.load;
        }

        function saveSettings() {
            AppState.config.name = document.getElementById('set-name').value || "Creality HI Bed Swap";
            AppState.config.prePrintDelay = parseInt(document.getElementById('set-delay').value) || 0;
            AppState.config.ip = document.getElementById('set-ip').value;
            AppState.config.unload = document.getElementById('set-unload').value || DEFAULT_UNLOAD;
            AppState.config.load = document.getElementById('set-load').value || DEFAULT_LOAD;
            
            localStorage.setItem('printerName', AppState.config.name);
            localStorage.setItem('prePrintDelay', AppState.config.prePrintDelay);
            localStorage.setItem('printerIp', AppState.config.ip);
            localStorage.setItem('unloadMacro', AppState.config.unload);
            localStorage.setItem('loadMacro', AppState.config.load);
            
            document.getElementById('display-name').innerText = AppState.config.name;
            document.getElementById('display-ip').innerText = AppState.config.ip || "No IP Set";
            
            renderList();
            closeModals();
        }

        function showSafety() {
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('safety-modal').style.display = 'block';
        }

        function beginFirstPrint() {
            closeModals();
            AppState.automationActive = true;
            startJob(AppState.queue[0]);
        }

        function closeModals() { document.getElementById('modal-overlay').style.display = 'none'; document.getElementById('settings-modal').style.display = 'none'; document.getElementById('safety-modal').style.display = 'none'; }
        function emergencyStop() { fetch(`${getBaseUrl()}/printer/emergency_stop`, {method:'POST'}); }
        
        function openCamera() {
            if (!AppState.config.ip) return;
            // Extract pure IP/Hostname in case user added http:// or port
            let host = AppState.config.ip.replace(/^(?:https?:\/\/)?/i, "").split(':')[0].split('/')[0]; 
            window.open(`http://${host}:8000/?action=stream`, '_blank');
        }

        async function togglePreheat() {
            const target = AppState.isPreheating ? 0 : 60;
            await runGcode(`M140 S${target}`);
            AppState.isPreheating = !AppState.isPreheating;
            document.getElementById('preheat-btn').classList.toggle('btn-primary', AppState.isPreheating);
            
            // Immediate feedback for UI
            const bedEl = document.getElementById('temp-bed');
            if (AppState.isPreheating) {
                bedEl.classList.add('heating');
                if (!bedEl.innerHTML.includes('♨️')) bedEl.innerHTML += ' <span style="font-size:0.8em">♨️</span>';
            } else {
                bedEl.classList.remove('heating');
                bedEl.innerText = bedEl.innerText.replace(' ♨️', '');
            }
        }

        function initApp() {
            document.getElementById('display-name').innerText = AppState.config.name;
            document.getElementById('display-ip').innerText = AppState.config.ip || "Disconnected";
            document.getElementById('app-version').innerText = APP_VERSION;
            renderList();
            setInterval(getStatus, 3000);
        }

        window.onload = initApp;
    </script>
</body>
</html>
